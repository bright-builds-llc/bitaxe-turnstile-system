# Runs `bun run verify`, then each role's Conformance Profile from `conformance/profiles.json` on its
# own, so each role's result is published (Core MVP criterion 12). The Rust tests start PostgreSQL
# through Docker, and the browser tests drive the runner's Google Chrome.
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The committed trusted-consent bundle is byte-compared with a fresh build, so CI builds
          # with the same Bun as the repository's `packageManager`.
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The repository has no TypeScript dependency; `tsc` comes from the checking machine, so CI
      # installs the version it is checked with locally.
      - name: Install TypeScript
        run: npm install --global typescript@5.9.3

      # Pinned, because `clippy -D warnings` fails on lints a newer stable adds. Move it with the
      # toolchain the repository is checked with locally.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: "Conformance: Client"
        run: bun run conformance client

      - name: "Conformance: Gate Authority"
        run: bun run conformance gate-authority

      - name: "Conformance: Pool Adapter"
        run: bun run conformance pool-adapter

      - name: "Conformance: Relying Service"
        run: bun run conformance relying-service

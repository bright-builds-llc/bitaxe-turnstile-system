[package]
name = "bwg-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.23.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
url = "2.5.8"
uuid = { version = "1.18.0", features = ["v4"] }

[dev-dependencies]
bitcoin = "0.32.6"
testcontainers = "0.28.0"

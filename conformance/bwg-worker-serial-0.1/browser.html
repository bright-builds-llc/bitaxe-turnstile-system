<h1>Serial adapter conformance</h1><p>Production browser adapter with a simulated device. No hardware effects.</p>
<output id="result" role="status">running</output><pre id="details"></pre>
<script type="module">
import{runWorkerSerialBrowserConformance}from"/dist/test-worker-serial/webserial-worker-browser-test-entry.js";
